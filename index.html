<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#273c75">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ぽんぽん花火">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="ぽんぽん花火">
    <title>ぽんぽん花火えほん</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="game-shell" class="game-shell" aria-label="ぽんぽん花火えほん">
      <canvas id="playfield" class="playfield" aria-label="画面をタップすると、やさしい花火が出ます。"></canvas>

      <div class="quiet-title" aria-hidden="true">
        <span>ぽんぽん花火</span>
      </div>

      <section id="finish-panel" class="finish-panel" aria-live="polite" aria-hidden="true" hidden>
        <div id="finish-message" class="finish-message">できたね</div>
        <button id="again-button" class="again-button" type="button">もういっかい</button>
      </section>
    </main>

    <noscript>
      <p class="noscript-message">JavaScriptを有効にすると遊べます。</p>
    </noscript>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
